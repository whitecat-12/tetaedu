<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCAD-like 3D Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background-color: #2d2d30;
            color: #cccccc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header Styles */
        .header {
            background-color: #323233;
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #3e3e42;
        }
        
        .logo {
            display: flex;
            align-items: center;
            margin-right: 30px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #0078d7 0%, #1e8cde 100%);
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .logo-text {
            font-weight: 600;
            color: #ffffff;
            font-size: 15px;
        }
        
        .menu-bar {
            display: flex;
            height: 100%;
        }
        
        .menu-item {
            padding: 0 12px;
            display: flex;
            align-items: center;
            height: 100%;
            cursor: pointer;
            font-size: 13px;
            color: #cccccc;
        }
        
        .menu-item:hover {
            background-color: #3e3e42;
            color: #ffffff;
        }
        
        /* Main Content */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* Toolbar */
        .toolbar {
            width: 64px;
            background-color: #333337;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            border-right: 1px solid #3e3e42;
        }
        
        .tool-button {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            color: #cccccc;
            font-size: 20px;
            background-color: transparent;
            border: none;
        }
        
        .tool-button:hover {
            background-color: #3e3e42;
            color: #ffffff;
        }
        
        .tool-button.active {
            background-color: #0078d7;
            color: #ffffff;
        }
        
        /* Right Panel */
        .right-panel {
            width: 320px;
            background-color: #252526;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid #3e3e42;
        }
        
        .panel-tab {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #cccccc;
        }
        
        .panel-tab.active {
            color: #ffffff;
            background-color: #2d2d30;
            border-bottom: 2px solid #0078d7;
        }
        
        .panel-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        
        .property-group {
            margin-bottom: 20px;
        }
        
        .property-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #cccccc;
        }
        
        .property-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .property-label {
            width: 100px;
            font-size: 12px;
            color: #969696;
        }
        
        .property-input {
            flex: 1;
            background-color: #3c3c3c;
            border: 1px solid #464647;
            color: #cccccc;
            padding: 4px 8px;
            border-radius: 3px;
        }
        
        /* Canvas Area */
        .canvas-container {
            flex: 1;
            position: relative;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        
        #canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .viewport-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .view-button {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background-color: #323233;
            border: 1px solid #3e3e42;
            color: #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .view-button:hover {
            background-color: #3e3e42;
            color: #ffffff;
        }
        
        /* Status Bar */
        .status-bar {
            height: 24px;
            background-color: #0078d7;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            color: #ffffff;
            justify-content: space-between;
        }
        
        .coords {
            display: flex;
            gap: 20px;
        }
        
        /* Command Line */
        .command-line {
            height: 28px;
            background-color: #323233;
            border-top: 1px solid #3e3e42;
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #cccccc;
        }
        
        .command-prefix {
            color: #569cd6;
            margin-right: 8px;
        }
        
        /* Icons */
        .icon {
            font-size: 16px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">CAD</div>
            <div class="logo-text">AutoCAD-like Editor</div>
        </div>
        <div class="menu-bar">
            <div class="menu-item">File</div>
            <div class="menu-item">Edit</div>
            <div class="menu-item">View</div>
            <div class="menu-item">Tools</div>
            <div class="menu-item">Draw</div>
            <div class="menu-item">Modify</div>
            <div class="menu-item">Help</div>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-container">
        <!-- Left Toolbar -->
        <div class="toolbar">
            <button class="tool-button active" title="Line" id="lineTool">📏</button>
            <button class="tool-button" title="Rectangle" id="rectTool">⬜</button>
            <button class="tool-button" title="Circle" id="circleTool">🔴</button>
            <button class="tool-button" title="Polygon" id="polygonTool">🔷</button>
            <div style="height: 16px;"></div>
            <button class="tool-button" title="Extrude" id="extrudeTool">🧊</button>
            <button class="tool-button" title="Revolve" id="revolveTool">🔄</button>
            <button class="tool-button" title="Move" id="moveTool">✥</button>
            <button class="tool-button" title="Rotate" id="rotateTool">🔄</button>
            <div style="height: 16px;"></div>
            <button class="tool-button" title="Zoom" id="zoomTool">🔍</button>
            <button class="tool-button" title="Pan" id="panTool">✋</button>
            <button class="tool-button" title="Orbit" id="orbitTool">🌍</button>
        </div>
        
        <!-- Canvas Area -->
        <div class="canvas-container">
            <div id="canvas"></div>
            <div class="viewport-controls">
                <button class="view-button" title="Top View" id="topView">↑</button>
                <button class="view-button" title="Front View" id="frontView">↓</button>
                <button class="view-button" title="Right View" id="rightView">→</button>
                <button class="view-button" title="Isometric View" id="isoView">↗</button>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="right-panel">
            <div class="panel-tabs">
                <div class="panel-tab active">Properties</div>
                <div class="panel-tab">Layers</div>
                <div class="panel-tab">Materials</div>
            </div>
            <div class="panel-content">
                <div class="property-group">
                    <div class="property-title">Geometry</div>
                    <div class="property-item">
                        <div class="property-label">Length</div>
                        <input type="text" class="property-input" value="0.00">
                    </div>
                    <div class="property-item">
                        <div class="property-label">Width</div>
                        <input type="text" class="property-input" value="0.00">
                    </div>
                    <div class="property-item">
                        <div class="property-label">Height</div>
                        <input type="text" class="property-input" value="0.00">
                    </div>
                </div>
                
                <div class="property-group">
                    <div class="property-title">Appearance</div>
                    <div class="property-item">
                        <div class="property-label">Color</div>
                        <input type="color" class="property-input" value="#569cd6" style="height: 24px;">
                    </div>
                    <div class="property-item">
                        <div class="property-label">Wireframe</div>
                        <input type="checkbox" class="property-input" style="width: 16px; height: 16px;">
                    </div>
                    <div class="property-item">
                        <div class="property-label">Opacity</div>
                        <input type="range" class="property-input" min="0" max="100" value="100">
                    </div>
                </div>
                
                <div class="property-group">
                    <div class="property-title">Extrusion</div>
                    <div class="property-item">
                        <div class="property-label">Height</div>
                        <input type="text" class="property-input" value="5.00" id="extrudeHeight">
                    </div>
                    <div class="property-item">
                        <div class="property-label">Segments</div>
                        <input type="number" class="property-input" value="1" min="1" max="10">
                    </div>
                    <div class="property-item">
                        <div class="property-label">Bevel</div>
                        <input type="checkbox" class="property-input" style="width: 16px; height: 16px;">
                    </div>
                    <button style="width: 100%; padding: 8px; margin-top: 10px; background: #0078d7; color: white; border: none; border-radius: 3px; cursor: pointer;">Apply Extrusion</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Command Line -->
    <div class="command-line">
        <span class="command-prefix">Command:</span>
        <span id="commandText">Ready</span>
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="coords">
            <span>X: 0.00</span>
            <span>Y: 0.00</span>
            <span>Z: 0.00</span>
        </div>
        <div>Ortho | Snap | Grid | Dyn</div>
    </div>

    <script>
        // Variabel global
        let scene, camera, renderer, controls;
        let drawing = false;
        let points = [];
        let line = null;
        let extrudedShape = null;
        let activeTool = 'line';
        let gridHelper, axesHelper;

        // Inisialisasi aplikasi
        function init() {
            // Setup scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e1e);
            
            // Setup camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(25, 25, 25);
            camera.lookAt(0, 0, 0);
            
            // Setup renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(document.getElementById('canvas').offsetWidth, document.getElementById('canvas').offsetHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas').appendChild(renderer.domElement);
            
            // Setup controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add grid helper
            gridHelper = new THREE.GridHelper(50, 50, 0x3c3c3c, 0x252525);
            scene.add(gridHelper);
            
            // Add axes helper
            axesHelper = new THREE.AxesHelper(10);
            scene.add(axesHelper);
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
            scene.add(ambientLight);
            
            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight1.position.set(1, 1, 1);
            scene.add(directionalLight1);
            
            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight2.position.set(-1, -1, -1);
            scene.add(directionalLight2);
            
            // Event listeners
            setupEventListeners();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Start animation loop
            animate();
            
            updateCommandLine("Ready");
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Canvas click event
            renderer.domElement.addEventListener('click', onCanvasClick);
            renderer.domElement.addEventListener('mousemove', onCanvasMouseMove);
            renderer.domElement.addEventListener('dblclick', onCanvasDoubleClick);
            
            // Tool buttons
            document.getElementById('lineTool').addEventListener('click', () => setActiveTool('line'));
            document.getElementById('rectTool').addEventListener('click', () => setActiveTool('rect'));
            document.getElementById('circleTool').addEventListener('click', () => setActiveTool('circle'));
            document.getElementById('polygonTool').addEventListener('click', () => setActiveTool('polygon'));
            document.getElementById('extrudeTool').addEventListener('click', () => setActiveTool('extrude'));
            document.getElementById('revolveTool').addEventListener('click', () => setActiveTool('revolve'));
            document.getElementById('moveTool').addEventListener('click', () => setActiveTool('move'));
            document.getElementById('rotateTool').addEventListener('click', () => setActiveTool('rotate'));
            document.getElementById('zoomTool').addEventListener('click', () => setActiveTool('zoom'));
            document.getElementById('panTool').addEventListener('click', () => setActiveTool('pan'));
            document.getElementById('orbitTool').addEventListener('click', () => setActiveTool('orbit'));
            
            // View buttons
            document.getElementById('topView').addEventListener('click', setTopView);
            document.getElementById('frontView').addEventListener('click', setFrontView);
            document.getElementById('rightView').addEventListener('click', setRightView);
            document.getElementById('isoView').addEventListener('click', setIsoView);
        }
        
        // Set active tool
        function setActiveTool(tool) {
            activeTool = tool;
            
            // Update UI
            document.querySelectorAll('.tool-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tool + 'Tool').classList.add('active');
            
            // Update controls based on tool
            if (tool === 'orbit') {
                controls.enabled = true;
            } else if (tool === 'pan') {
                controls.enabled = true;
            } else {
                controls.enabled = false;
            }
            
            updateCommandLine(`${tool} tool selected`);
        }
        
        // Handle canvas click
        function onCanvasClick(event) {
            if (['line', 'rect', 'circle', 'polygon'].includes(activeTool)) {
                // Dapatkan posisi mouse dalam koordinat Three.js
                const mouse = new THREE.Vector2();
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                
                // Raycasting untuk menentukan posisi di grid
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);
                
                // Hitung perpotongan dengan grid (plane XY)
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                const intersectPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, intersectPoint);
                
                // Bulatkan ke grid terdekat (snap to grid)
                intersectPoint.x = Math.round(intersectPoint.x);
                intersectPoint.y = Math.round(intersectPoint.y);
                intersectPoint.z = 0;
                
                // Tambahkan titik
                points.push(intersectPoint.clone());
                
                // Gambar garis
                drawLine();
                
                updateCommandLine(`Point added at ${intersectPoint.x.toFixed(2)}, ${intersectPoint.y.toFixed(2)}`);
            }
        }
        
        // Handle canvas double click
        function onCanvasDoubleClick() {
            if (['line', 'polygon'].includes(activeTool) && points.length > 0) {
                // Finish drawing
                drawing = false;
                updateCommandLine(`Shape completed with ${points.length} points`);
            }
        }
        
        // Update koordinat mouse
        function onCanvasMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            
            // Untuk demo saja, koordinat 3D sebenarnya lebih kompleks
            const x = (mouseX / rect.width) * 50 - 25;
            const y = -((mouseY / rect.height) * 50 - 25);
            
            document.querySelector('.coords').innerHTML = `
                <span>X: ${x.toFixed(2)}</span>
                <span>Y: ${y.toFixed(2)}</span>
                <span>Z: 0.00</span>
            `;
        }
        
        // Gambar garis dari titik-titik
        function drawLine() {
            // Hapus garis lama jika ada
            if (line) {
                scene.remove(line);
                line.geometry.dispose();
                line.material.dispose();
            }
            
            if (points.length < 2) return;
            
            // Buat geometri garis
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: 0x569cd6, 
                linewidth: 2 
            });
            line = new THREE.Line(geometry, material);
            scene.add(line);
        }
        
        // Ekstrusi garis menjadi bentuk 3D
        function applyExtrusion() {
            if (points.length < 2) {
                alert("Gambar setidaknya 2 titik terlebih dahulu!");
                return;
            }
            
            // Hapus bentuk lama jika ada
            if (extrudedShape) {
                scene.remove(extrudedShape);
                extrudedShape.geometry.dispose();
                extrudedShape.material.dispose();
            }
            
            // Buat bentuk dari titik
            const shape = new THREE.Shape(points);
            
            // Settings ekstrusi
            const height = document.getElementById('extrudeHeight').value;
            const extrudeSettings = {
                depth: parseFloat(height),
                bevelEnabled: false
            };
            
            // Buat geometri ekstrusi
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            
            // Buat material dengan warna yang dipilih
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x569cd6,
                flatShading: true,
                side: THREE.DoubleSide
            });
            
            // Buat mesh dan tambahkan ke scene
            extrudedShape = new THREE.Mesh(geometry, material);
            scene.add(extrudedShape);
            
            updateCommandLine(`Extrusion applied with height ${height}`);
        }
        
        // View functions
        function setTopView() {
            camera.position.set(0, 50, 0);
            camera.lookAt(0, 0, 0);
            updateCommandLine("Top view activated");
        }
        
        function setFrontView() {
            camera.position.set(0, 0, 50);
            camera.lookAt(0, 0, 0);
            updateCommandLine("Front view activated");
        }
        
        function setRightView() {
            camera.position.set(50, 0, 0);
            camera.lookAt(0, 0, 0);
            updateCommandLine("Right view activated");
        }
        
        function setIsoView() {
            camera.position.set(25, 25, 25);
            camera.lookAt(0, 0, 0);
            updateCommandLine("Isometric view activated");
        }
        
        // Update command line
        function updateCommandLine(text) {
            document.getElementById('commandText').textContent = text;
        }
        
        // Handle window resize
        function onWindowResize() {
            camera.aspect = document.getElementById('canvas').offsetWidth / document.getElementById('canvas').offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(document.getElementById('canvas').offsetWidth, document.getElementById('canvas').offsetHeight);
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Inisialisasi aplikasi saat halaman dimuat
        window.onload = init;
    </script>
</body>
</html>
