<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform 3D Sederhana</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
        }
        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="add-cube">Tambah Kubus</button>
        <button id="add-sphere">Tambah Sphere</button>
        <button id="pan-mode">Mode Pan</button>
        <button id="rotate-mode">Mode Rotate</button>
        <button id="reset-view">Reset View</button>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="status">Siap: Mode Rotate</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script>
        // Inisialisasi scene, camera, dan renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Kontrol orbit untuk navigasi
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.25;
        
        // Pencahayaan
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);
        
        // Grid helper
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);
        
        // Axis helper
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // Variabel untuk interaksi
        let selectedObject = null;
        let isPanMode = false;
        
        // Fungsi untuk menambah objek kubus
        function addCube() {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ 
                color: Math.random() * 0xffffff,
                transparent: true,
                opacity: 0.8
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5
            );
            scene.add(cube);
            return cube;
        }
        
        // Fungsi untuk menambah objek sphere
        function addSphere() {
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshPhongMaterial({ 
                color: Math.random() * 0xffffff,
                transparent: true,
                opacity: 0.8
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5
            );
            scene.add(sphere);
            return sphere;
        }
        
        // Event listeners untuk tombol toolbar
        document.getElementById('add-cube').addEventListener('click', () => {
            addCube();
        });
        
        document.getElementById('add-sphere').addEventListener('click', () => {
            addSphere();
        });
        
        document.getElementById('pan-mode').addEventListener('click', () => {
            isPanMode = true;
            controls.enableRotate = false;
            document.getElementById('status').textContent = 'Siap: Mode Pan';
        });
        
        document.getElementById('rotate-mode').addEventListener('click', () => {
            isPanMode = false;
            controls.enableRotate = true;
            document.getElementById('status').textContent = 'Siap: Mode Rotate';
        });
        
        document.getElementById('reset-view').addEventListener('click', () => {
            camera.position.set(0, 0, 5);
            controls.reset();
        });
        
        // Fungsi untuk menangani resize window
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Fungsi animasi
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
