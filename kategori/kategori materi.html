<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETA SAINS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7E22CE; /* Ungu solid */
            --primary-light: #A855F7;
            --primary-dark: #6B21A8;
            --accent: #f59e0b;
            --gold: #fbbf24;
            --silver: #9ca3af;
            --bronze: #b45309;
        }
        
        body {
            font-family: 'Baloo 2', cursive;
            background-color: #f8fafc;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .app-logo {
            display: flex;
            align-items: center;
        }
        
        .app-logo-icon {
            background: var(--primary); /* Warna ungu solid */
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
        }
        
        .app-name {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary); /* Warna ungu solid */
        }
        
        .login-card {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(126, 34, 206, 0.2); /* Shadow ungu */
        }
        
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary); /* Warna ungu solid */
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.2); /* Shadow ungu */
            outline: none;
        }
        
        .btn-login {
            background: var(--primary); /* Warna ungu solid */
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-login:hover {
            background: var(--primary-dark); /* Warna ungu solid lebih gelap */
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(126, 34, 206, 0.3); /* Shadow ungu */
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .divider::before {
            margin-right: 10px;
        }
        
        .divider::after {
            margin-left: 10px;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
        }
        
        .floating-label {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus + .floating-label,
        .form-input:not(:placeholder-shown) + .floating-label {
            top: -10px;
            left: 40px;
            font-size: 12px;
            background: white;
            padding: 0 5px;
            color: var(--primary);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        .header-bg {
            background-color: var(--primary); /* Warna ungu solid */
        }
        
        .guest-btn {
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 9999px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .guest-btn:hover {
            background-color: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Mobile App Container -->
    <div class="app-container">
        <!-- App Header -->
        <header class="header-bg p-4 text-white">
            <div class="flex justify-between items-center">
                <div class="app-logo">
                    <div class="app-logo-icon floating-icon">
                        <i class="fas fa-atom"></i>
                    </div>
                    <h1 class="app-name">TETA SAINS</h1>
                </div>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <main class="p-6">
            <!-- Welcome Section -->
            <section class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Selamat Datang</h2>
                <p class="text-gray-600">Masuk untuk menjelajahi lab virtual fisika</p>
            </section>
            
            <!-- Login Form -->
            <section class="login-card bg-white p-6">
                <form id="loginForm">
                    <div class="input-group">
                        <i class="input-icon fas fa-user"></i>
                        <input type="text" class="form-input" id="username" placeholder=" " autocomplete="off">
                        <label for="username" class="floating-label">Username atau Email</label>
                    </div>
                    
                    <div class="input-group">
                        <i class="input-icon fas fa-lock"></i>
                        <input type="password" class="form-input" id="password" placeholder=" " autocomplete="off">
                        <label for="password" class="floating-label">Kata Sandi</label>
                        <span class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center">
                            <input type="checkbox" id="remember" class="mr-2 h-4 w-4 text-primary rounded focus:ring-primary">
                            <label for="remember" class="text-sm text-gray-600">Ingat saya</label>
                        </div>
                        <a href="#" class="text-sm text-primary font-semibold">Lupa kata sandi?</a>
                    </div>
                    
                    <button type="submit" class="btn-login mb-6">
                        Masuk
                    </button>
                    
                    <div class="divider mb-6">atau lanjutkan dengan</div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <button type="button" class="social-btn">
                            <i class="fab fa-google text-red-500 mr-2"></i>
                            Google
                        </button>
                        <button type="button" class="social-btn">
                            <i class="fab fa-facebook text-blue-600 mr-2"></i>
                            Facebook
                        </button>
                    </div>
                    
                    <div class="text-center">
                        <span class="text-sm text-gray-600">Belum punya akun? </span>
                        <a href="#" class="text-sm text-primary font-semibold">Daftar Sekarang</a>
                    </div>
                </form>
            </section>
            
            <!-- Guest Option -->
            <section class="text-center mt-6">
                <p class="text-gray-600 mb-4">Atau jelajahi sebagai tamu</p>
                <button class="guest-btn">
                    Lanjutkan sebagai Tamu
                </button>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle eye icon
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
            
            // Form submission
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // Simple validation
                if (!username || !password) {
                    alert('Harap isi semua field');
                    return;
                }
                
                // Simulate login process
                const loginBtn = this.querySelector('.btn-login');
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
                loginBtn.disabled = true;
                
                setTimeout(function() {
                    alert('Login berhasil! Selamat datang di TETA SAINS.');
                    loginBtn.innerHTML = 'Masuk';
                    loginBtn.disabled = false;
                    // In a real app, you would redirect here
                    // window.location.href = 'home.html';
                }, 1500);
            });
            
            // Add floating label functionality
            const inputs = document.querySelectorAll('.form-input');
            
            inputs.forEach(input => {
                // Check if input has value on page load (for browser autofill)
                if (input.value) {
                    input.nextElementSibling.classList.add('active');
                }
                
                input.addEventListener('focus', function() {
                    this.nextElementSibling.classList.add('active');
                });
                
                input.addEventListener('blur', function() {
                    if (!this.value) {
                        this.nextElementSibling.classList.remove('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
