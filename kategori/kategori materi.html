<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETA SAINS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <style>
        :root {
            --primary: #38b2ac;
            --secondary: #0e7490;
            --accent: #f59e0b;
            --gold: #fbbf24;
            --silver: #9ca3af;
            --bronze: #b45309;
        }
        
        body {
            font-family: 'Baloo 2', cursive;
            background-color: #0f172a;
            margin: 0;
            overflow: hidden;
        }
        
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 30px rgba(56, 178, 172, 0.2);
            z-index: 1;
        }
        
        .app-logo {
            display: flex;
            align-items: center;
        }
        
        .app-logo-icon {
            background: linear-gradient(135deg, #38b2ac, #0e7490);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
        }
        
        .app-name {
            font-weight: 700;
            font-size: 1.25rem;
            background: linear-gradient(135deg, #38b2ac, #0e7490);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-card {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(56, 178, 172, 0.2);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
        
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 178, 172, 0.2);
            outline: none;
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(56, 178, 172, 0.3);
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .divider::before {
            margin-right: 10px;
        }
        
        .divider::after {
            margin-left: 10px;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
        }
        
        .floating-label {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus + .floating-label,
        .form-input:not(:placeholder-shown) + .floating-label {
            top: -10px;
            left: 40px;
            font-size: 12px;
            background: white;
            padding: 0 5px;
            color: var(--primary);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        .atom-loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        
        .atom {
            position: relative;
            width: 80px;
            height: 80px;
            animation: rotate 3s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .electron {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }
        
        .electron::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
        }
        
        .electron:nth-child(2) {
            transform: rotate(60deg);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
        
        .electron:nth-child(2)::before {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
        }
        
        .electron:nth-child(3) {
            transform: rotate(120deg);
            border-color: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
        }
        
        .electron:nth-child(3)::before {
            background: var(--secondary);
            box-shadow: 0 0 10px var(--secondary), 0 0 20px var(--secondary);
        }
        
        .nucleus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
        }
    </style>
</head>
<body>
    <!-- Three.js Container -->
    <div id="three-container"></div>
    
    <!-- Atom Loader -->
    <div class="atom-loader" id="atomLoader">
        <div class="atom">
            <div class="electron"></div>
            <div class="electron"></div>
            <div class="electron"></div>
            <div class="nucleus"></div>
        </div>
    </div>
    
    <!-- Mobile App Container -->
    <div class="app-container">
        <!-- App Header -->
        <header class="bg-gradient-to-r from-primary to-secondary p-4 text-white">
            <div class="flex justify-between items-center">
                <div class="app-logo">
                    <div class="app-logo-icon floating-icon">
                        <i class="fas fa-atom"></i>
                    </div>
                    <h1 class="app-name">TETA SAINS</h1>
                </div>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <main class="p-6">
            <!-- Welcome Section -->
            <section class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Selamat Datang</h2>
                <p class="text-gray-600">Masuk untuk menjelajahi lab virtual fisika</p>
            </section>
            
            <!-- Login Form -->
            <section class="login-card bg-white p-6">
                <form id="loginForm">
                    <div class="input-group">
                        <i class="input-icon fas fa-user"></i>
                        <input type="text" class="form-input" id="username" placeholder=" " autocomplete="off">
                        <label for="username" class="floating-label">Username atau Email</label>
                    </div>
                    
                    <div class="input-group">
                        <i class="input-icon fas fa-lock"></i>
                        <input type="password" class="form-input" id="password" placeholder=" " autocomplete="off">
                        <label for="password" class="floating-label">Kata Sandi</label>
                        <span class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center">
                            <input type="checkbox" id="remember" class="mr-2 h-4 w-4 text-primary rounded focus:ring-primary">
                            <label for="remember" class="text-sm text-gray-600">Ingat saya</label>
                        </div>
                        <a href="#" class="text-sm text-primary font-semibold">Lupa kata sandi?</a>
                    </div>
                    
                    <button type="submit" class="btn-login mb-6">
                        Masuk
                    </button>
                    
                    <div class="divider mb-6">atau lanjutkan dengan</div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <button type="button" class="social-btn">
                            <i class="fab fa-google text-red-500 mr-2"></i>
                            Google
                        </button>
                        <button type="button" class="social-btn">
                            <i class="fab fa-facebook text-blue-600 mr-2"></i>
                            Facebook
                        </button>
                    </div>
                    
                    <div class="text-center">
                        <span class="text-sm text-gray-600">Belum punya akun? </span>
                        <a href="#" class="text-sm text-primary font-semibold">Daftar Sekarang</a>
                    </div>
                </form>
            </section>
            
            <!-- Guest Option -->
            <section class="text-center mt-6">
                <p class="text-gray-600 mb-4">Atau jelajahi sebagai tamu</p>
                <button class="border-2 border-primary text-primary font-semibold py-3 px-6 rounded-full text-sm">
                    Lanjutkan sebagai Tamu
                </button>
            </section>
        </main>
    </div>

    <script>
        // Three.js Particle System
        let scene, camera, renderer, particles;
        
        function initThreeJS() {
            // Setup scene
            scene = new THREE.Scene();
            
            // Setup camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            
            // Setup renderer
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            document.getElementById('three-container').appendChild(renderer.domElement);
            
            // Create particles
            const particleCount = 100;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                
                // Random positions
                positions[i3] = (Math.random() - 0.5) * 20;
                positions[i3 + 1] = (Math.random() - 0.5) * 20;
                positions[i3 + 2] = (Math.random() - 0.5) * 10;
                
                // Random colors with blue/green theme
                colors[i3] = Math.random() * 0.2 + 0.2;     // R
                colors[i3 + 1] = Math.random() * 0.5 + 0.5; // G
                colors[i3 + 2] = Math.random() * 0.5 + 0.5; // B
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            // Particle material
            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            // Create particle system
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
            
            // Start animation
            animate();
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate particles
            particles.rotation.x += 0.001;
            particles.rotation.y += 0.002;
            
            // Move particles in wave pattern
            const positions = particles.geometry.attributes.position.array;
            const time = Date.now() * 0.001;
            
            for (let i = 0; i < positions.length; i += 3) {
                positions[i] += Math.sin(time + i) * 0.001;
                positions[i + 1] += Math.cos(time + i) * 0.001;
            }
            
            particles.geometry.attributes.position.needsUpdate = true;
            
            renderer.render(scene, camera);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Show loader while Three.js initializes
            document.getElementById('atomLoader').style.display = 'block';
            
            // Initialize Three.js after a short delay
            setTimeout(() => {
                initThreeJS();
                document.getElementById('atomLoader').style.display = 'none';
            }, 1000);
            
            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle eye icon
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
            
            // Form submission
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // Simple validation
                if (!username || !password) {
                    alert('Harap isi semua field');
                    return;
                }
                
                // Simulate login process
                const loginBtn = this.querySelector('.btn-login');
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
                loginBtn.disabled = true;
                
                // Show atom loader
                document.getElementById('atomLoader').style.display = 'block';
                
                setTimeout(function() {
                    document.getElementById('atomLoader').style.display = 'none';
                    alert('Login berhasil! Selamat datang di TETA SAINS.');
                    loginBtn.innerHTML = 'Masuk';
                    loginBtn.disabled = false;
                    // In a real app, you would redirect here
                    // window.location.href = 'home.html';
                }, 2000);
            });
            
            // Add floating label functionality
            const inputs = document.querySelectorAll('.form-input');
            
            inputs.forEach(input => {
                // Check if input has value on page load (for browser autofill)
                if (input.value) {
                    input.nextElementSibling.classList.add('active');
                }
                
                input.addEventListener('focus', function() {
                    this.nextElementSibling.classList.add('active');
                });
                
                input.addEventListener('blur', function() {
                    if (!this.value) {
                        this.nextElementSibling.classList.remove('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
