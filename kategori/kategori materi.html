<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETA SAINS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7EC8E3;
            --secondary: #0000FF;
            --accent: #f59e0b;
            --gold: #fbbf24;
            --silver: #9ca3af;
            --bronze: #b45309;
        }
        
        body {
            font-family: 'Baloo 2', cursive;
            background-color: #0a0a1a;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: white;
        }
        
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background: rgba(10, 10, 26, 0.8);
            min-height: 100vh;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(126, 200, 227, 0.2);
        }
        
        .app-logo {
            display: flex;
            align-items: center;
        }
        
        .app-logo-icon {
            background: var(--primary);
            color: #0a0a1a;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            box-shadow: 0 0 15px var(--primary);
        }
        
        .app-name {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(126, 200, 227, 0.7);
        }
        
        .login-card {
            border-radius: 16px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.7);
            box-shadow: 0 10px 25px -5px rgba(126, 200, 227, 0.3);
            border: 1px solid rgba(126, 200, 227, 0.2);
        }
        
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            z-index: 10;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid rgba(126, 200, 227, 0.3);
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.6);
            color: white;
        }
        
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(126, 200, 227, 0.2);
            outline: none;
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .btn-login {
            background: var(--primary);
            color: #0a0a1a;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(126, 200, 227, 0.4);
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #7EC8E3;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(126, 200, 227, 0.3);
        }
        
        .divider::before {
            margin-right: 10px;
        }
        
        .divider::after {
            margin-left: 10px;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid rgba(126, 200, 227, 0.3);
            border-radius: 12px;
            font-family: 'Baloo 2', cursive;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.6);
            color: white;
        }
        
        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            cursor: pointer;
            z-index: 10;
        }
        
        .floating-label {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus + .floating-label,
        .form-input:not(:placeholder-shown) + .floating-label {
            top: -10px;
            left: 40px;
            font-size: 12px;
            background: rgba(15, 23, 42, 0.9);
            padding: 0 5px;
            color: var(--primary);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -2;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Three.js Container -->
    <div id="three-container"></div>
    
    <!-- Star background -->
    <div class="stars" id="stars"></div>
    
    <!-- Mobile App Container -->
    <div class="app-container">
        <!-- App Header -->
        <header class="p-4" style="background: rgba(10, 10, 26, 0.5);">
            <div class="flex justify-between items-center">
                <div class="app-logo">
                    <div class="app-logo-icon floating-icon">
                        <i class="fas fa-atom"></i>
                    </div>
                    <h1 class="app-name">TETA SAINS</h1>
                </div>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <main class="p-6">
            <!-- Welcome Section -->
            <section class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white mb-2">Selamat Datang</h2>
                <p class="text-blue-200">Masuk untuk menjelajahi lab virtual fisika</p>
            </section>
            
            <!-- Login Form -->
            <section class="login-card p-6">
                <form id="loginForm">
                    <div class="input-group">
                        <i class="input-icon fas fa-user"></i>
                        <input type="text" class="form-input" id="username" placeholder=" " autocomplete="off">
                        <label for="username" class="floating-label">Username atau Email</label>
                    </div>
                    
                    <div class="input-group">
                        <i class="input-icon fas fa-lock"></i>
                        <input type="password" class="form-input" id="password" placeholder=" " autocomplete="off">
                        <label for="password" class="floating-label">Kata Sandi</label>
                        <span class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center">
                            <input type="checkbox" id="remember" class="mr-2 h-4 w-4 text-primary rounded focus:ring-primary">
                            <label for="remember" class="text-sm text-blue-200">Ingat saya</label>
                        </div>
                        <a href="#" class="text-sm text-primary font-semibold">Lupa kata sandi?</a>
                    </div>
                    
                    <button type="submit" class="btn-login mb-6">
                        Masuk
                    </button>
                    
                    <div class="divider mb-6">atau lanjutkan dengan</div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <button type="button" class="social-btn">
                            <i class="fab fa-google text-red-400 mr-2"></i>
                            Google
                        </button>
                        <button type="button" class="social-btn">
                            <i class="fab fa-facebook text-blue-400 mr-2"></i>
                            Facebook
                        </button>
                    </div>
                    
                    <div class="text-center">
                        <span class="text-sm text-blue-200">Belum punya akun? </span>
                        <a href="#" class="text-sm text-primary font-semibold">Daftar Sekarang</a>
                    </div>
                </form>
            </section>
            
            <!-- Guest Option -->
            <section class="text-center mt-6">
                <p class="text-blue-200 mb-4">Atau jelajahi sebagai tamu</p>
                <button class="border-2 border-primary text-primary font-semibold py-3 px-6 rounded-full text-sm bg-transparent hover:bg-primary hover:text-[#0a0a1a] transition-colors">
                    Lanjutkan sebagai Tamu
                </button>
            </section>
        </main>
    </div>

    <script>
        // Three.js Black Hole Implementation
        let scene, camera, renderer;
        let blackHole;
        
        function initThreeJS() {
            // Setup scene
            scene = new THREE.Scene();
            
            // Setup camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            
            // Setup renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            document.getElementById('three-container').appendChild(renderer.domElement);
            
            // Create black hole
            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x000000,
                transparent: true,
                opacity: 0.9
            });
            
            blackHole = new THREE.Mesh(geometry, material);
            scene.add(blackHole);
            
            // Create accretion disk
            const diskGeometry = new THREE.RingGeometry(1.2, 3, 64);
            const diskMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x7EC8E3,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.7
            });
            
            const accretionDisk = new THREE.Mesh(diskGeometry, diskMaterial);
            accretionDisk.rotation.x = Math.PI / 2;
            scene.add(accretionDisk);
            
            // Create particles for gravitational lensing effect
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 5000;
            const posArray = new Float32Array(particlesCount * 3);
            
            for (let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 10;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                color: 0x7EC8E3,
                size: 0.01,
                transparent: true
            });
            
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);
            
            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0x7EC8E3, 0.5);
            scene.add(ambientLight);
            
            // Add point light
            const pointLight = new THREE.PointLight(0x7EC8E3, 1, 100);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);
            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                
                blackHole.rotation.y += 0.005;
                accretionDisk.rotation.z += 0.002;
                
                renderer.render(scene, camera);
            }
            
            animate();
        }
        
        // Create starry background
        function createStars() {
            const stars = document.getElementById('stars');
            const starsCount = 200;
            
            for (let i = 0; i < starsCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                
                star.style.animationDuration = (Math.random() * 5 + 3) + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                
                stars.appendChild(star);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Three.js
            initThreeJS();
            
            // Create stars
            createStars();
            
            // Toggle password visibility
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle eye icon
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
            
            // Form submission
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // Simple validation
                if (!username || !password) {
                    alert('Harap isi semua field');
                    return;
                }
                
                // Simulate login process
                const loginBtn = this.querySelector('.btn-login');
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
                loginBtn.disabled = true;
                
                setTimeout(function() {
                    alert('Login berhasil! Selamat datang di TETA SAINS.');
                    loginBtn.innerHTML = 'Masuk';
                    loginBtn.disabled = false;
                    // In a real app, you would redirect here
                    // window.location.href = 'home.html';
                }, 1500);
            });
            
            // Add floating label functionality
            const inputs = document.querySelectorAll('.form-input');
            
            inputs.forEach(input => {
                // Check if input has value on page load (for browser autofill)
                if (input.value) {
                    input.nextElementSibling.classList.add('active');
                }
                
                input.addEventListener('focus', function() {
                    this.nextElementSibling.classList.add('active');
                });
                
                input.addEventListener('blur', function() {
                    if (!this.value) {
                        this.nextElementSibling.classList.remove('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
